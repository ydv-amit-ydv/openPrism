name: Tests and validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: JavaScript syntax (ES modules)
        run: |
          for f in openprism/static/js/*.js; do cp "$f" /tmp/m.mjs && node --check /tmp/m.mjs || { echo "syntax error in $f"; exit 1; }; done
      - name: JavaScript unit tests
        run: node tests/js/formulas.test.mjs
      - name: Python tests (includes NIST, R-reference, reproducibility and reduced calibration checks)
        run: python -m pytest -q
      - name: Full validation report
        run: python validation/run_validation.py --reps 2000
      - name: Manual is up to date
        run: python tools/build_manual.py && git diff --exit-code -- openprism/static/help/manual.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            docs/VALIDATION.md
            validation/results.json
